name: 自动构建Hexo博客
on:
  push:
    branches: [ dev ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装Node环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装Hexo
        run: npm install -g hexo-cli
      - name: 安装依赖
        run: npm install
      - name: 生成静态网页
        run: hexo generate
      - name: 部署到Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
